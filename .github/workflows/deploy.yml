# Выкладка лендинга на it3.artro-flex.com по FTPS при каждом push в main (и вручную: Actions → Deploy → Run workflow).
# Загружаются только изменённые файлы (состояние хранится на сервере в .ftp-deploy-sync-state.json).
# Схема та же, что у ArtroFlexIT2.
#
# Секреты репозитория (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER    — ftp.artro-flex.com
#   FTP_USERNAME  — it3.artroflex@it3.artro-flex.com
#   FTP_PASSWORD  — пароль этого FTP-аккаунта
# Переменная (вкладка Variables, необязательно):
#   FTP_SERVER_DIR — папка сайта относительно корня FTP-аккаунта.
#                    FTP-аккаунт it3 смотрит прямо в /home/artrofle/it3.artro-flex — оставьте пустой (будет ./).
#
# Токен Webvork, пароль редактора отзывов и соль — НЕ в GitHub, а в /home/artrofle/artroflex3-config.php
# (уровнем выше папки сайта, загружается один раз вручную). Образец — config.example.php.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-it3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка синтаксиса PHP
        run: for f in api/*.php; do php -l "$f"; done

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.artro-flex.com' }}
          username: ${{ secrets.FTP_USERNAME || 'it3.artroflex@it3.artro-flex.com' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Не выкладываем внутренние файлы и не трогаем данные, которые живут на сервере
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            docs/**
            README.md
            config.example.php
            artroflex3-config.php
            api/secrets.php
            _data/reviews.json
            _data/logs/**
            _data/rate/**
            _data/requests/**
            _data/phones/**
            assets/img/reviews/*.jpg
            assets/img/reviews/*.png
            assets/img/reviews/*.webp
